<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подборка: МАРТдекор</title>
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css"></head><body>
<header id="site-header"></header>
<main class="wrap"><div class="page-h"><span class="eyebrow">Подборка</span><h1>Ваша подборка материалов</h1>
<p class="lead">Это&nbsp;не&nbsp;корзина: оплаты на&nbsp;сайте нет.&nbsp;Менеджер проверит наличие и&nbsp;количество, предложит замены и&nbsp;пришлёт счёт.</p></div>
<div class="pod-page"><div><div id="pod"></div><div id="pod-sum"></div></div>
<form class="form" data-demo><h3>Получить расчёт</h3><label>Имя<input name="name" required autocomplete="name"></label><label>Телефон<input name="tel" type="tel" required autocomplete="tel" placeholder="+7"></label>
<label>Площадь и&nbsp;что&nbsp;важно учесть<textarea name="note" rows="3"></textarea></label>
<label class="drop">Проект или&nbsp;фото, если&nbsp;есть<input type="file" name="file"><span class="file-n"></span></label>
<label>Как&nbsp;связаться<select name="channel"><option>WhatsApp</option><option>Telegram</option><option>MAX</option><option>Позвонить</option></select></label><label class="check"><input type="checkbox" required><span>Даю согласие на&nbsp;обработку персональных данных</span></label><button class="btn">Отправить подборку</button><p class="ok" tabindex="-1" hidden>Это&nbsp;прототип, заявка никуда не&nbsp;ушла. На&nbsp;готовом сайте она&nbsp;сразу попадёт менеджеру.</p></form></div></main>
<footer id="site-footer"></footer>
<script src="js/typo.js"></script><script src="js/data.js"></script><script src="js/main.js"></script>
</body></html>
