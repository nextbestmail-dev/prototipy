<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Каталог — ANNAIVANOVA</title>
<meta name="description" content="Авторская одежда Анны Ивановой: платья, жакеты, блузы, плащи и платки из коллекций «Метель» и «Саратов. Вдохновение». Ограниченный тираж.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500&family=Tenor+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=16">
</head>
<body data-page="catalog">
<div id="site-header"></div>

<div class="page-head"><div class="wrap">
  <div class="crumbs"><a href="index.html">Главная</a> \ <span id="crumb">Магазин</span></div>
  <div class="eyebrow" id="eyebrow">Магазин <i>\</i> новая коллекция <i>\</i> осень-зима 2027</div>
  <h1 id="title" style="font-size:clamp(40px,5vw,64px)">Магазин</h1>
  <p id="subtitle">Графитовые оттенки, чёткие линии плеч, приталенные жакеты и&nbsp;блеск пайеток&nbsp;— словно снег в&nbsp;вечернем свете.</p>
  <a href="story.html?id=metel" class="link" id="story-link" style="display:inline-block;margin-top:18px">История коллекции</a>
</div></div>

<div class="wrap shop">
  <div class="drawer-back" id="dback" onclick="toggleDrawer(false)"></div>
  <aside class="filters drawer" id="drawer">
    <div class="drawer-head"><b>Фильтры</b><button class="modal-close" style="position:static" onclick="toggleDrawer(false)" aria-label="Закрыть">×</button></div>
    <div class="grp"><h4>Коллекция</h4><div id="f-coll"></div></div>
    <div class="grp"><h4>Категория</h4><div id="f-cat"></div></div>
    <div class="grp"><h4>Размер</h4><div class="sizes" id="f-size"></div><p class="demo-note" style="margin-top:10px">Размеры «Метели»&nbsp;— для&nbsp;примера.</p></div>
    <div class="grp" style="border:0"><h4>Наличие</h4>
      <label class="chk"><input type="checkbox" id="f-stock"> Только в&nbsp;наличии</label>
    </div>
  </aside>
  <div>
    <div class="cat-tabs" id="tabs"></div>
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <div style="display:flex;gap:10px;align-items:center"><button class="chip" onclick="toggleDrawer(true)">Фильтры</button>
      <select id="sort" aria-label="Сортировка">
        <option value="def">Сначала новинки</option>
        <option value="asc">Цена по&nbsp;возрастанию</option>
        <option value="desc">Цена по&nbsp;убыванию</option>
      </select></div>
    </div>
    <div id="promo"></div>
    <div class="goods c3" id="grid"></div>
  </div>
</div>

<div id="site-footer"></div>
<script src="js/data.js?v=16"></script>
<script src="js/main.js?v=16"></script>
<script>
/* Магазин — только вещи по полной цене. Всё со скидкой живёт отдельно, в Outlet. */
const OUTLET_MODE = qs.get('coll') === 'outlet';
if (OUTLET_MODE) document.body.dataset.page = 'outlet';
const CURRENT = 'fw27'; /* актуальная коллекция: при смене коллекции меняется здесь */
const BASE = PRODUCTS.filter(p => OUTLET_MODE ? !!p.old : p.coll === CURRENT && !p.old);
const st = { coll: !OUTLET_MODE && qs.get('coll') ? [qs.get('coll')] : [], cat: qs.get('cat') ? [qs.get('cat')] : [], size: null, stock: false, sort: 'def' };

function boxes(el, list, key) {
  const field = key === 'coll' ? 'coll' : 'cat';
  const rows = list.map(x => [x, BASE.filter(p => p[field] === x.id).length]).filter(r => r[1]);
  el.closest('.grp').style.display = rows.length > 1 ? '' : 'none';
  el.innerHTML = rows.map(([x, n]) => `<label class="chk"><input type="checkbox" value="${x.id}" ${st[key].includes(x.id) ? 'checked' : ''}> ${x.name}<em>${n}</em></label>`).join('');
  el.querySelectorAll('input').forEach(i => i.onchange = () => {
    st[key] = [...el.querySelectorAll('input:checked')].map(x => x.value); render();
  });
}
function toggleDrawer(on) { document.getElementById('drawer').classList.toggle('open', on); document.getElementById('dback').classList.toggle('on', on); }
function paintTabs() {
  const cats = CATEGORIES.filter(c => BASE.some(p => p.cat === c.id));
  const all = !st.cat.length;
  document.getElementById('tabs').innerHTML = `<button class="${all ? 'on' : ''}" data-c="">Все</button>` + cats.map(c => `<button class="${st.cat.length === 1 && st.cat[0] === c.id ? 'on' : ''}" data-c="${c.id}">${c.name}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { st.cat = b.dataset.c ? [b.dataset.c] : []; sync(); });
}
function sizesOf(p) { return p.oneSize ? [] : p.stockSizes || SIZES_ALL; }

function render() {
  let list = BASE.filter(p =>
    (!st.coll.length || st.coll.includes(p.coll)) &&
    (!st.cat.length || st.cat.includes(p.cat)) &&
    (!st.size || sizesOf(p).includes(st.size)) &&
    (!st.stock || p.status === 'stock'));
  if (st.sort === 'asc') list.sort((a, b) => a.price - b.price);
  if (st.sort === 'desc') list.sort((a, b) => b.price - a.price);
  const cards = list.map(cardHTML);
  const story = !OUTLET_MODE && !st.cat.length && STORIES.find(s => s.coll === (st.coll[0] || 'fw27'));
  if (story && cards.length > 4) cards.splice(4, 0, `<a class="camp-tile" href="story.html?id=${story.id}">${phTone(story.tone, '')}<div class="st-cap"><small>История коллекции · ${story.season}</small><b>${story.title}</b><span>${story.lead}</span></div></a>`);
  document.getElementById('grid').innerHTML = list.length ? cards.join('')
    : '<div class="empty">Под&nbsp;такие фильтры моделей нет. Нужный размер можно <a href="info.html#tailoring">сшить по&nbsp;меркам</a>.</div>';

  const chips = [];
  st.coll.forEach(c => chips.push([COLLECTIONS[c].short, () => st.coll = st.coll.filter(x => x !== c)]));
  st.cat.forEach(c => chips.push([CATEGORIES.find(x => x.id === c).name, () => st.cat = st.cat.filter(x => x !== c)]));
  if (st.size) chips.push(['Размер ' + st.size, () => st.size = null]);
  if (st.stock) chips.push(['В наличии', () => st.stock = false]);
  const ch = document.getElementById('chips');
  ch.innerHTML = chips.length ? chips.map((c, i) => `<button class="chip on" data-i="${i}">${c[0]} ×</button>`).join('') + '<button class="chip" data-reset>Сбросить</button>'
    : `<span class="muted" style="font-size:14px">${plural(list.length, 'модель', 'модели', 'моделей')}</span>`;
  ch.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { chips[b.dataset.i][1](); sync(); });
  const r = ch.querySelector('[data-reset]'); if (r) r.onclick = () => { st.coll = []; st.cat = []; st.size = null; st.stock = false; sync(); };

  const one = st.coll.length === 1 && !st.cat.length ? COLLECTIONS[st.coll[0]] : st.cat.length === 1 && !st.coll.length ? CATEGORIES.find(x => x.id === st.cat[0]) : null;
  document.getElementById('title').textContent = OUTLET_MODE ? 'Outlet' : '«Метель»';
  document.getElementById('crumb').textContent = OUTLET_MODE ? 'Outlet' : (one ? 'Магазин \ ' + one.name : 'Магазин');
  document.getElementById('eyebrow').style.display = OUTLET_MODE ? 'none' : '';
  document.getElementById('story-link').style.display = OUTLET_MODE ? 'none' : '';
  const sub = document.getElementById('subtitle');
  if (OUTLET_MODE) sub.textContent = 'Авторские вещи из прошлых коллекций Анны Ивановой — по более доступной цене. Для многих это первая вещь ANNAIVANOVA.';
  document.getElementById('promo').innerHTML = OUTLET_MODE ? `<div class="o-promo"><b>${OUTLET_PROMO.title}</b><span>${OUTLET_PROMO.text}</span><em>${OUTLET_PROMO.note}</em></div>` : '';
}
function sync() {
  boxes(document.getElementById('f-coll'), Object.values(COLLECTIONS).filter(c => c.id !== 'event'), 'coll');
  boxes(document.getElementById('f-cat'), CATEGORIES, 'cat');
  paintTabs();
  document.getElementById('f-size').innerHTML = SIZES_ALL.map(s => `<button class="size ${st.size === s ? 'on' : ''}" data-s="${s}">${s}</button>`).join('');
  document.querySelectorAll('#f-size .size').forEach(b => b.onclick = () => { st.size = st.size === b.dataset.s ? null : b.dataset.s; sync(); });
  document.getElementById('f-stock').checked = st.stock;
  render();
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('f-stock').onchange = e => { st.stock = e.target.checked; render(); };
  document.getElementById('sort').onchange = e => { st.sort = e.target.value; render(); };
  sync();
});
</script>
</body>
</html>
